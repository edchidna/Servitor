name: Turso migration validation

on:
  push:
    branches:
      - migration/turso
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syntax-and-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/turso

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install from the generated lockfile
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run local libSQL migration smoke tests
        run: npm run test:libsql

      - name: Commit generated lockfile when changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: generate Turso migration lockfile"
            git push origin HEAD:migration/turso
          fi
