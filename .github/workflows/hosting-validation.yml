name: Hosting branch validation

on:
  push:
    branches:
      - hosting/render-setup
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hosting branch
        uses: actions/checkout@v4
        with:
          ref: hosting/render-setup

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Run local libSQL tests (without remote credentials)
        run: env -u TURSO_TEST_DATABASE_URL -u TURSO_TEST_AUTH_TOKEN npm run test:libsql

      - name: Run Operations modal regression test
        run: npm run test:operations-modal
